<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yugen — Waitlist</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600..900;1,9..144,600..900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <section class="hero">
    <div class="wipe"></div>
    <div class="hero-container">
      <div class="shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
      </div>
      <div class="content">
        <h1 class="headline"></h1>
        <p class="subtext">No noise, no rush. Just early access when it's ready.</p>
        <form class="waitlist-form">
          <input type="email" placeholder="Enter your email" required />
          <button type="submit">Join</button>
        </form>
        <p class="microtext"><span class="count" data-target="212">0</span> people already in — join before it's loud.</p>
      </div>
    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
